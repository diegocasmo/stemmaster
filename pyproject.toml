[project]
name = "stemmaster"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "numba==0.68.1",
    "numpy==2.5.4",
    "pedalboard==0.9.26",
    "pyloudnorm==0.2.0",
    "scipy==1.18.1",
    "soundfile==0.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
